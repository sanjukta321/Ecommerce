<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/store_customizations/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SB Store</title>
  <!-- Ensure URL starts with /shop so React Router basename="/shop" works -->
  <script>(function(){var p=window.location.pathname;if(!p.startsWith('/shop')){window.location.replace('/shop'+(p==='/'?'':p)+window.location.search+window.location.hash);}})();</script>
  <!-- Define window.frappe so Frappe's csrf_token injection doesn't throw ReferenceError -->
  <script>window.frappe = window.frappe || {};</script>
  <!-- csrf_token -->
  <!-- React bundle — built by: cd frontend && npm run build -->
  <!-- Deployed by: bench build --app store_customizations  -->
  <script type="module" crossorigin src="{{ index_js }}"></script>
  <link rel="stylesheet" crossorigin href="/assets/store_customizations/index.css?v={{ asset_version }}" />
</head>
<body>
  <div id="root"></div>
</body>
</html>
